<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Fill It Baby — Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 560px;
      margin: 40px auto;
      padding: 0 20px 40px;
      color: #333;
    }
    h1 { font-size: 20px; }
    h2 { font-size: 16px; margin-top: 32px; padding-bottom: 8px; border-bottom: 2px solid #e8f0fe; color: #4A90D9; }
    label { display: block; margin-top: 12px; font-weight: 600; font-size: 13px; color: #555; }
    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
    }
    input[type="text"]:focus, input[type="password"]:focus {
      outline: none;
      border-color: #4A90D9;
      box-shadow: 0 0 0 2px rgba(74, 144, 217, 0.2);
    }
    button {
      margin-top: 12px;
      padding: 8px 20px;
      background: #4A90D9;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: #357ABD; }
    .status {
      margin-top: 12px;
      padding: 8px;
      border-radius: 4px;
      display: none;
      font-size: 13px;
    }
    .status.success { display: block; background: #d4edda; color: #155724; }
    .status.error { display: block; background: #f8d7da; color: #721c24; }

    /* Dealer Defaults */
    .dealer-list { margin-top: 12px; }
    .dealer-card {
      background: #f9f9f9;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 10px;
    }
    .dealer-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .dealer-card-header strong { font-size: 14px; }
    .dealer-card-actions { display: flex; gap: 6px; }
    .dealer-card-actions button {
      margin-top: 0;
      padding: 4px 10px;
      font-size: 12px;
    }
    .btn-delete { background: #dc3545; }
    .btn-delete:hover { background: #c82333; }
    .dealer-card-detail {
      font-size: 12px;
      color: #666;
      line-height: 1.5;
    }
    .dealer-form {
      background: #f0f7ff;
      border: 1px solid #cce0ff;
      border-radius: 6px;
      padding: 16px;
      margin-top: 12px;
    }
    .dealer-form .field-row {
      display: flex;
      gap: 10px;
    }
    .dealer-form .field-row > div { flex: 1; }
    .dealer-form .field-sm { max-width: 100px; flex: 0 0 100px; }
    .dealer-form-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .btn-cancel { background: #6c757d; }
    .btn-cancel:hover { background: #5a6268; }
    .empty-state {
      color: #999;
      font-size: 13px;
      font-style: italic;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h1>Fill It Baby — Settings</h1>

  <!-- API Key Section -->
  <h2>Claude API Key</h2>
  <label for="apiKey">API Key</label>
  <input type="password" id="apiKey" placeholder="sk-ant-...">
  <button id="saveApiKey">Save API Key</button>
  <div id="apiKeyStatus" class="status"></div>

  <!-- Dealer Defaults Section -->
  <h2>Dealer Defaults</h2>
  <p style="font-size:13px;color:#666;margin-top:4px;">
    Save your dealership info here. Used as fallback when the source document doesn't contain dealer details.
  </p>

  <div id="dealerList" class="dealer-list"></div>
  <div id="emptyState" class="empty-state">No dealers saved yet.</div>

  <button id="addDealerBtn">Add Dealer</button>

  <!-- Add/Edit Dealer Form (hidden by default) -->
  <div id="dealerForm" class="dealer-form" style="display:none;">
    <input type="hidden" id="editIndex" value="-1">
    <label for="dfName">Dealer Name</label>
    <input type="text" id="dfName" placeholder="e.g. Universal Auto Plaza">
    <div class="field-row">
      <div>
        <label for="dfPhone">Phone</label>
        <input type="text" id="dfPhone" placeholder="(555) 123-4567">
      </div>
    </div>
    <label for="dfAddress">Street Address</label>
    <input type="text" id="dfAddress">
    <div class="field-row">
      <div>
        <label for="dfCity">City</label>
        <input type="text" id="dfCity">
      </div>
      <div class="field-sm">
        <label for="dfState">State</label>
        <input type="text" id="dfState" maxlength="2">
      </div>
      <div class="field-sm">
        <label for="dfZip">Zip</label>
        <input type="text" id="dfZip">
      </div>
    </div>
    <div class="dealer-form-actions">
      <button id="saveDealerBtn">Save Dealer</button>
      <button id="cancelDealerBtn" class="btn-cancel">Cancel</button>
    </div>
  </div>

  <div id="dealerStatus" class="status"></div>

  <script src="options.js"></script>
</body>
</html>
