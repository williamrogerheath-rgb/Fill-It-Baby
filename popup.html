<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fill It Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Fill It Pro</h1>

    <div class="mode-selector">
      <label>
        <input type="radio" name="mode" value="webForm" checked> Fill Web Form
      </label>
      <label>
        <input type="radio" name="mode" value="fillPdf"> Fill PDF
      </label>
    </div>

    <!-- Template selector (shown only in fillPdf mode) -->
    <div id="template-bar" hidden>
      <div class="template-row">
        <select id="template-select">
          <option value="">-- Pick template --</option>
          <option value="APPI_CANCELLATION">APPI Cancellation</option>
        </select>
        <button id="manage-templates-btn" class="btn-icon" title="Manage Templates">⚙</button>
      </div>
    </div>

    <!-- Upload Section -->
    <div id="upload-section">
      <div id="drop-zone" class="drop-zone">
        <p>Drag &amp; drop a PDF here</p>
        <p>or</p>
        <input type="file" id="file-input" accept=".pdf" hidden>
        <button id="browse-btn" class="btn">Browse Files</button>
      </div>

      <div id="file-info" class="file-info" hidden>
        <span id="file-name"></span>
        <button id="clear-file" class="btn-small">&times;</button>
      </div>

      <button id="submit-btn" class="btn btn-primary" disabled>Extract &amp; Fill</button>
    </div>

    <!-- Template Manager (hidden until gear icon clicked) -->
    <div id="template-manager" hidden>
      <div class="review-header">
        <button id="tm-back-btn" class="back-btn">&larr; Back</button>
        <span class="review-title">Manage Templates</span>
      </div>

      <div class="review-section">
        <div class="section-label">Add New Template</div>
        <p class="hint">Upload a blank fillable PDF to scan its fields.</p>
        <input type="file" id="tm-file-input" accept=".pdf" hidden>
        <button id="tm-upload-btn" class="btn" style="width:100%;margin-bottom:8px;">Upload Blank PDF</button>
        <div id="tm-scan-result" hidden>
          <div class="field">
            <label>Template Name</label>
            <input type="text" id="tm-name" placeholder="e.g. Nebraska Title App">
          </div>
          <div id="tm-field-count" class="hint"></div>
          <button id="tm-save-btn" class="btn btn-primary" style="margin-top:8px;">Save Template</button>
        </div>
      </div>

      <div class="review-section">
        <div class="section-label">Saved Templates</div>
        <div id="tm-list"></div>
      </div>
    </div>

    <!-- APPI Review Form (hidden until extraction in fillPdf mode with APPI template) -->
    <div id="pdf-review" hidden>
      <div class="review-header">
        <button id="back-btn" class="back-btn">&larr; Back</button>
        <span class="review-title">Review &amp; Generate</span>
      </div>

      <div class="review-section">
        <div class="section-label">Consumer</div>
        <div class="field-row">
          <div class="field"><label>Name</label><input type="text" id="r-consumerName"></div>
          <div class="field"><label>Name 2 / Co-buyer</label><input type="text" id="r-consumerName2"></div>
        </div>
        <div class="field"><label>VIN</label><input type="text" id="r-vin" style="text-transform:uppercase"></div>
        <div class="field"><label>Address</label><input type="text" id="r-address"></div>
        <div class="field-row">
          <div class="field"><label>City</label><input type="text" id="r-city"></div>
          <div class="field field-sm"><label>State</label><input type="text" id="r-state" maxlength="2"></div>
          <div class="field field-sm"><label>Zip</label><input type="text" id="r-zip"></div>
        </div>
      </div>

      <div class="review-section">
        <div class="section-label">Cancellation</div>
        <div class="field"><label>Date of Cancellation</label><input type="text" id="r-cancelDate" placeholder="MM/DD/YYYY"></div>
        <div class="field">
          <label>Reason</label>
          <select id="r-cancelReason">
            <option value="">-- Select --</option>
            <option value="customerRequest">Customer Request</option>
            <option value="dealUnwind">Deal Unwind</option>
            <option value="earlyPayoff">Early Payoff</option>
            <option value="reWrite">Re-Write</option>
            <option value="repossession">Repossession</option>
            <option value="tradeIn">Trade-In</option>
            <option value="totalLoss">Total Loss - No Claim Filed</option>
          </select>
        </div>
        <div class="field">
          <label>Refund Payable To</label>
          <select id="r-refundTo">
            <option value="lienholder">Lien Holder</option>
            <option value="dealer">Dealer</option>
            <option value="consumer">Consumer</option>
          </select>
        </div>
      </div>

      <div class="review-section">
        <div class="section-label">Lender / Lessor</div>
        <div class="field"><label>Name</label><input type="text" id="r-lenderName"></div>
        <div class="field"><label>Phone</label><input type="text" id="r-lenderPhone"></div>
        <div class="field"><label>Address</label><input type="text" id="r-lenderAddress"></div>
        <div class="field-row">
          <div class="field"><label>City</label><input type="text" id="r-lenderCity"></div>
          <div class="field field-sm"><label>State</label><input type="text" id="r-lenderState" maxlength="2"></div>
          <div class="field field-sm"><label>Zip</label><input type="text" id="r-lenderZip"></div>
        </div>
      </div>

      <div class="review-section">
        <div class="section-label">Dealer</div>
        <div id="dealer-defaults-picker" hidden>
          <select id="dealer-select"><option value="">-- Pick saved dealer --</option></select>
        </div>
        <div class="field"><label>Name</label><input type="text" id="r-dealerName"></div>
        <div class="field"><label>Phone</label><input type="text" id="r-dealerPhone"></div>
        <div class="field"><label>Address</label><input type="text" id="r-dealerAddress"></div>
        <div class="field-row">
          <div class="field"><label>City</label><input type="text" id="r-dealerCity"></div>
          <div class="field field-sm"><label>State</label><input type="text" id="r-dealerState" maxlength="2"></div>
          <div class="field field-sm"><label>Zip</label><input type="text" id="r-dealerZip"></div>
        </div>
      </div>

      <div class="review-section">
        <div class="section-label">Signature Dates</div>
        <div class="field-row">
          <div class="field"><label>Consumer Date</label><input type="text" id="r-consumerDate1" placeholder="MM/DD/YYYY"></div>
          <div class="field"><label>Dealer Date</label><input type="text" id="r-dealerDate1" placeholder="MM/DD/YYYY"></div>
        </div>
      </div>

      <button id="generate-btn" class="btn btn-primary generate-btn">Generate Filled PDF</button>
    </div>

    <!-- Generic Review Form (for scanned templates) -->
    <div id="generic-review" hidden>
      <div class="review-header">
        <button id="gen-back-btn" class="back-btn">&larr; Back</button>
        <span class="review-title" id="gen-review-title">Review &amp; Generate</span>
      </div>
      <div id="gen-fields"></div>
      <button id="gen-generate-btn" class="btn btn-primary generate-btn">Generate Filled PDF</button>
    </div>

    <div id="status" class="status" hidden></div>
  </div>

  <script src="pdf-lib.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
